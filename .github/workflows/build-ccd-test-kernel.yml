name: Build CCD suspend test kernel
on:
  workflow_dispatch:
  push:
    branches: [ccd-test-kernel-7.2.7]
    paths: ['kernel-test/**', '.github/workflows/build-ccd-test-kernel.yml']
permissions:
  contents: read
concurrency:
  group: ccd-kernel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    container: archlinux:base-devel
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed git python bc bison flex openssl libelf pahole cpio rsync kmod zstd rust rust-src rust-bindgen clang llvm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and verify kernel
        shell: bash
        env:
          BUILD_JOBS: '4'
        run: |
          bash -n kernel-test/build.sh
          python -m py_compile kernel-test/verify.py
          bash kernel-test/build.sh
      - name: Upload kernel and corresponding source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-7.2.7-valve2-ccdtest1
          path: kernel-test/out/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ccd-kernel-build-diagnostics
          path: kernel-test/logs/**
          if-no-files-found: ignore
          retention-days: 14
